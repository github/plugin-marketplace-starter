# Vally configuration for the included plugins' evals.
paths:
  # evals/ mirrors plugins/: one eval per skill or agent, such as
  # evals/<plugin>/skills/<skill>/eval.yaml.
  evals:
    - evals
  evalFilenames:
    - eval.yaml
    - "*.eval.yaml"
  results: evals/results
environments:
  marketplace:
    # Vally resolves these paths relative to each eval, not this file.
    files:
      - src: ../../../../marketplace.json
        dest: .vally-eval-pin.json
    skills:
      - ../../../../plugins/plugin-authoring/skills/add-plugin
      - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
      - ../../../../plugins/plugin-authoring/skills/submit-plugin
      - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
      - ../../../../plugins/marketplace-maintainer/skills/release-plugins
      - ../../../../plugins/pr-description/skills/pr-description
    # Vally runs setup in each trial workspace; Copilot discovers these skills natively.
    commands:
      - >-
        node -e "const fs = require('node:fs'); const { execFileSync } =
        require('node:child_process'); try { const entry =
        JSON.parse(fs.readFileSync('.vally-eval-pin.json',
        'utf8')).plugins?.find(p => p.name === 'eval'); if (entry) { const pin =
        entry.source; if (!pin || pin.source !== 'github' || pin.repo !==
        'github/evals' || pin.path !== 'packages/plugin' || typeof pin.sha !==
        'string' || !/^[0-9a-f]{40}$/.test(pin.sha) || (pin.ref !== undefined &&
        (typeof pin.ref !== 'string' || !/^[A-Za-z0-9._/-]+$/.test(pin.ref) ||
        pin.ref.startsWith('-')))) { throw new Error('Invalid eval remote pin in
        marketplace.json'); } execFileSync('git', ['init', '-q',
        '.vally-eval-source'], { stdio: 'inherit' }); execFileSync('git', ['-C',
        '.vally-eval-source', 'remote', 'add', 'origin',
        'https://github.com/github/evals.git'], { stdio: 'inherit' });
        execFileSync('git', ['-C', '.vally-eval-source', 'sparse-checkout',
        'set', 'packages/plugin/skills'], { stdio: 'inherit' });
        execFileSync('git', ['-C', '.vally-eval-source', 'fetch',
        '--filter=blob:none', '--depth', '1', '--no-tags', 'origin', pin.sha], {
        stdio: 'inherit' }); execFileSync('git', ['-C', '.vally-eval-source',
        'checkout', '-q', '--detach', 'FETCH_HEAD'], { stdio: 'inherit' });
        fs.cpSync('.vally-eval-source/packages/plugin/skills', '.github/skills',
        { recursive: true }); } } finally { fs.rmSync('.vally-eval-source', {
        recursive: true, force: true }); fs.rmSync('.vally-eval-pin.json', {
        force: true }); }"
suites:
  smoke:
    description: One representative case for each skill and agent
    filter:
      suite: smoke
  full:
    description: Every case
    evals:
      - evals/**/eval.yaml
      - evals/**/*.eval.yaml
