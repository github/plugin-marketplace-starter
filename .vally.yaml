# Vally configuration for the included plugins' evals.
defaults:
  backend:
    name: docker
    args:
      grade-network: none
paths:
  # evals/ mirrors plugins/: one eval per skill or agent, such as
  # evals/<plugin>/skills/<skill>/eval.yaml.
  evals:
    - evals
  evalFilenames:
    - eval.yaml
    - "*.eval.yaml"
  results: evals/results
environments:
  marketplace:
    # Vally resolves these paths relative to each eval, not this file.
    skills:
      - ../../../../plugins/plugin-authoring/skills/add-plugin
      - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
      - ../../../../plugins/plugin-authoring/skills/submit-plugin
      - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
      - ../../../../plugins/marketplace-maintainer/skills/release-plugins
      - ../../../../plugins/pr-description/skills/pr-description
    # Vally runs setup in each trial workspace; Copilot discovers these skills natively.
    commands:
      - git clone --filter=blob:none --no-checkout --depth 1 --branch
        copilot-evals-v0.24.0 --sparse https://github.com/github/evals.git
        .vally-eval-source
      - git -C .vally-eval-source sparse-checkout set packages/plugin/skills
      - git -C .vally-eval-source checkout --detach
        34ddb5803aeaee8330ab70c19ad1a3f37fb77ded
      - >-
        node -e "const fs = require('node:fs');
        fs.cpSync('.vally-eval-source/packages/plugin/skills', '.github/skills',
        { recursive: true }); fs.rmSync('.vally-eval-source', { recursive: true
        });"
suites:
  smoke:
    description: One representative case for each skill and agent
    filter:
      suite: smoke
  full:
    description: Every case
    evals:
      - evals/**/eval.yaml
      - evals/**/*.eval.yaml
