# Vally configuration for the included plugins' evals.
paths:
  # evals/ mirrors plugins/: one eval per skill or agent, such as
  # evals/<plugin>/skills/<skill>/eval.yaml.
  evals:
    - evals
  evalFilenames:
    - eval.yaml
    - "*.eval.yaml"
  results: evals/results
environments:
  marketplace:
    # Vally resolves these paths relative to each eval, not this file.
    files:
      - src: ../../../../marketplace.json
        dest: .vally-eval-pin.json
    skills:
      - ../../../../plugins/plugin-authoring/skills/add-plugin
      - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
      - ../../../../plugins/plugin-authoring/skills/submit-plugin
      - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
      - ../../../../plugins/marketplace-maintainer/skills/release-plugins
      - ../../../../plugins/pr-description/skills/pr-description
    # Vally runs setup in each trial workspace; Copilot discovers these skills natively.
    commands:
      - >-
        node -e "const fs = require('node:fs');
        const { execFileSync } = require('node:child_process');
        try {
        const catalog = JSON.parse(fs.readFileSync('.vally-eval-pin.json', 'utf8'));
        const entry = (catalog.plugins || []).find((p) => p && p.name === 'eval');
        const src = entry && entry.source;
        const ok = Boolean(src) && src.source === 'github'
        && src.repo === 'github/evals' && src.path === 'packages/plugin'
        && typeof src.ref === 'string' && src.ref.startsWith('copilot-evals-v')
        && src.ref.includes('..') === false && /[^A-Za-z0-9_.-]/.test(src.ref) === false
        && typeof src.sha === 'string' && src.sha.length === 40
        && /[^0-9a-f]/.test(src.sha) === false;
        if (ok === false) throw new Error('Invalid eval remote pin in marketplace.json');
        const sub = 'packages/plugin/skills';
        fs.rmSync('.vally-eval-source', { recursive: true, force: true });
        const gitEnv = { ...process.env, GIT_TERMINAL_PROMPT: '0' };
        execFileSync('git', ['clone', '--filter=blob:none', '--no-checkout', '--depth', '1',
        '--branch', src.ref, '--sparse', 'https://github.com/github/evals.git',
        '.vally-eval-source'], { stdio: 'inherit', env: gitEnv });
        execFileSync('git', ['-C', '.vally-eval-source', 'sparse-checkout', 'set', sub],
        { stdio: 'inherit', env: gitEnv });
        execFileSync('git', ['-C', '.vally-eval-source', 'checkout', '--detach', src.sha],
        { stdio: 'inherit', env: gitEnv });
        fs.cpSync('.vally-eval-source/' + sub, '.github/skills', { recursive: true });
        } finally {
        fs.rmSync('.vally-eval-source', { recursive: true, force: true });
        fs.rmSync('.vally-eval-pin.json', { force: true });
        }"
suites:
  smoke:
    description: One representative case for each skill and agent
    filter:
      suite: smoke
  full:
    description: Every case
    evals:
      - evals/**/eval.yaml
      - evals/**/*.eval.yaml
