# Vally project configuration, also read by scripts/validate.mjs,
# scripts/validate-evals.mjs, and scripts/evals.mjs. When you add, rename, or
# remove a plugin with skills, update paths.skills; npm run verify checks it.
paths:
  skills: [ plugins/plugin-authoring/skills, plugins/marketplace-maintainer/skills ]
  # evals/ mirrors plugins/: one eval per asset, such as
  # evals/<plugin>/skills/<skill>/eval.yaml. See docs/evals.md#layout.
  evals:
    - evals
  # eval.yaml is Vally's default. *.eval.yaml lets one folder hold several
  # specs, such as release.eval.yaml. Both work.
  evalFilenames:
    - eval.yaml
    - "*.eval.yaml"
  results: vally-results
# Values containing a slash are repository-relative paths. The launcher and CI
# pass them to evals as absolute paths.
params:
  # The headless canvas host that drives a real canvas extension in evals, and
  # each extension it loads. See docs/evals.md#extensions.
  CANVAS_HOST: evals/support/canvas-host.mjs
  # Synthetic disposable workspaces using real template tooling, without eval answer keys.
  MAINTENANCE_WORKSPACE: evals/support/maintenance-workspace.mjs
suites:
  smoke:
    description: Representative model-backed coverage for every local skill, agent,
      hook, extension, and MCP tool
    filter:
      suite: smoke
  full:
    description: Positive, negative, and boundary cases for every local plugin
    evals:
      - evals/**/eval.yaml
      - evals/**/*.eval.yaml
