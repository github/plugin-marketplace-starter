name: New plugin
description: Propose a plugin for this marketplace before building it.
title: "New plugin: "
body:
  - type: markdown
    attributes:
      value: |
        Agreeing on scope and risk first saves rework.
  - type: input
    id: name
    attributes:
      label: Plugin name
      description: Lowercase letters, digits, and hyphens.
      placeholder: release-notes
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What it does
      description: What task does it help with, and who uses it? Give a realistic request someone would type.
    validations:
      required: true
  - type: textarea
    id: runs
    attributes:
      label: What runs, and when
      description: Any code the plugin runs on an installer's machine, such as hooks, MCP servers, or scripts, and when it runs. Write "none" if it runs no code.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Files, network, credentials, and data
      description: Which files it reads or writes, which hosts it contacts, which credentials it uses, what data it keeps, and what it sends to the model. Write "none" for each that doesn't apply.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and remote sources
      description: New packages, their licenses, and any install scripts. For a remote plugin, the repository, path, and the commit sha you reviewed.
    validations:
      required: false
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who will maintain it?
    validations:
      required: true
