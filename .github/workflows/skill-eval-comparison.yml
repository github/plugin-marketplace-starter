name: Skill eval comparison
on:
  pull_request:
    paths:
      - plugins/*/skills/**
      - evals/*/skills/**
      - .github/workflows/skill-eval-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skill_dirs: ${{ steps.changed.outputs.skill_dirs }}
      eval_paths: ${{ steps.changed.outputs.eval_paths }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            dirs=("plugins/pr-description/skills/pr-description")
          else
            mapfile -t dirs < <(
              git diff --name-only "$BASE_SHA" HEAD -- 'plugins/*/skills/*' \
                | awk -F/ 'NF>=4 {print "plugins/"$2"/"$3"/"$4}' \
                | sort -u
            )
          fi
          skill_dirs=()
          eval_paths=()
          for dir in "${dirs[@]}"; do
            [ -n "$dir" ] || continue
            eval_path="evals/${dir#plugins/}/eval.yaml"
            if git cat-file -e "${BASE_SHA:-HEAD}:$dir/SKILL.md" 2>/dev/null && [ -f "$dir/SKILL.md" ] && [ -f "$eval_path" ]; then
              skill_dirs+=("$dir")
              eval_paths+=("$eval_path")
            fi
          done
          {
            echo "skill_dirs<<EOF"
            printf '%s\n' "${skill_dirs[@]}"
            echo "EOF"
            echo "eval_paths<<EOF"
            printf '%s\n' "${eval_paths[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  run-baseline:
    needs: select
    if: needs.select.outputs.eval_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore baseline skill sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKILL_DIRS: ${{ needs.select.outputs.skill_dirs }}
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            skill_name="${dir##*/}"
            fixture_path="evals/_shared/fixtures/${skill_name}/SKILL.verbose-fixture.md"
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -f "$fixture_path" ]; then
              cp "$fixture_path" "$dir/SKILL.md"
            elif [ -n "$BASE_SHA" ]; then
              rm -rf -- "$dir"
              git checkout "$BASE_SHA" -- "$dir"
            fi
          done <<< "$SKILL_DIRS"
      - uses: github/evals-action@5f484895664d7bbf307f858b08969b83e974b1ab
        continue-on-error: true
        env:
          VALLY_TELEMETRY_OPTOUT: '1'
        with:
          command: run
          working-directory: .
          eval-paths: ${{ needs.select.outputs.eval_paths }}
          report-id: evals-baseline
          copilot-token: ${{ github.token }}
          max-retries: 0

  run:
    needs: select
    if: needs.select.outputs.eval_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/evals-action@5f484895664d7bbf307f858b08969b83e974b1ab
        env:
          VALLY_TELEMETRY_OPTOUT: '1'
        with:
          command: run
          working-directory: .
          eval-paths: ${{ needs.select.outputs.eval_paths }}
          report-id: evals
          copilot-token: ${{ github.token }}
          max-retries: 0

  report:
    needs: [select, run-baseline, run]
    if: always() && needs.select.outputs.eval_paths != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: evals-${{ github.workflow_ref }}
      cancel-in-progress: false
    steps:
      - uses: github/evals-action@5f484895664d7bbf307f858b08969b83e974b1ab
        with:
          command: report
          report-id: evals
          baseline-report-id: evals-baseline
