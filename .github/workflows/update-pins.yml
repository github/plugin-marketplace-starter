name: Update plugin pin
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the proposed update without publishing a PR.
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: update-plugin-pin
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.repository == 'github/plugin-marketplace-starter' &&
      (github.event_name == 'workflow_dispatch' || vars.PIN_AUTOMATION == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-pins.mjs update --body-file "$RUNNER_TEMP/pin-pr.md"
      - if: steps.plan.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: node .github/scripts/update-pins.mjs publish --title "$TITLE" --body-file "$RUNNER_TEMP/pin-pr.md"
