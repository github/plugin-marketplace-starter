name: Publish skill eval comparison
on:
  workflow_run:
    workflows: ["Skill evals (before and after)"]
    types: [completed]
permissions: {}
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: skill-eval-comment-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download only the triggering run and attempt into temporary data storage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: skill-comparison-${{ github.event.workflow_run.run_attempt }}-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/skill-comparison
      - name: Validate source provenance and publish with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/skill-eval-comment.mjs post "$RUNNER_TEMP/skill-comparison"
