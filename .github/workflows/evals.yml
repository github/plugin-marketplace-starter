name: Evals
# Runs the smoke evals with real Copilot sessions, which cost AI credits.
# Start by explicit manual dispatch only; pull requests never start paid runs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    env:
      VALLY_TELEMETRY_OPTOUT: '1'
      COPILOT_CLI_PATH: ${{ github.workspace }}/node_modules/@github/copilot/npm-loader.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval -- --suite smoke --require-pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
