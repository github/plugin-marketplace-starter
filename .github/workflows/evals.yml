name: Evals
# Runs the smoke evals with real Copilot sessions, which cost AI credits.
# This full smoke-suite workflow starts by explicit manual dispatch only.
# Same-repository PRs that change plugins/<plugin>/skills/<skill>/ with a matching
# evals/<plugin>/skills/<skill>/eval.yaml run .github/workflows/skill-eval-comparison.yml
# (using github/evals-action@3c551330898c1467b8ddf9ef7c7f6e6c6af489d6 from
# github/evals-action#34 with report-id: evals-baseline and
# baseline-report-id: evals-baseline to update one sticky PR comment automatically);
# see docs/checks-and-evals.md#automatic-pr-skill-comparison.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    env:
      VALLY_TELEMETRY_OPTOUT: '1'
      COPILOT_CLI_PATH: ${{ github.workspace }}/node_modules/@github/copilot/npm-loader.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval -- --suite smoke --require-pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
