name: Behavioral evals
on:
  pull_request:
    paths:
      - plugins/**
      - evals/**
      - schemas/**
      - scripts/**
      - .vally.yaml
      - package.json
      - package-lock.json
      - .github/workflows/evals.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
      pull-requests: write
    concurrency:
      group: evals-${{ github.workflow_ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
      # The Action installs only Vally. Graders, the brainstorm MCP host, and the
      # pinned full Copilot runtime for custom-agent delegation come from npm ci.
      - run: npm ci --no-audit --no-fund
      # The Action can't pass --param, so write gitignored eval.params.yaml files
      # with this runner's absolute MCP server paths.
      - run: node scripts/evals.mjs action-params
      - uses: github/evals-action@v0.1.0
        env:
          # Vally's SDK executor launches this bridge, which runs the pinned full runtime.
          COPILOT_CLI_PATH: ${{ github.workspace }}/scripts/eval-runtime.js
          # The authoring grader lints generated files with the pinned Vally CLI.
          MARKETPLACE_VALLY_CLI: ${{ github.workspace }}/node_modules/@microsoft/vally-cli/dist/index.js
        with:
          working-directory: .
          suite: ${{ inputs.suite || 'smoke' }}
          vally-version: '0.19.0'
          copilot-token: ${{ github.token }}
          # The Action forwards only allowlisted variables to Vally. These two are
          # non-secret paths; naming them here is how the Action passes them through.
          credential-env: |
            COPILOT_CLI_PATH
            MARKETPLACE_VALLY_CLI
          workers: 1
          max-retries: 1
          upload-transcripts: false