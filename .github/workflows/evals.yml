name: Evals
# Runs the smoke evals with real Copilot sessions, which cost AI credits.
# Pull requests run them only when the repository variable ENABLE_EVALS is true.
on:
  pull_request:
    paths: [plugins/**, evals/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    # Never on forks or drafts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_EVALS == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    env:
      VALLY_TELEMETRY_OPTOUT: '1'
      # The pinned Copilot CLI, which the plugin-reviewer eval needs to delegate to a custom agent.
      COPILOT_CLI_PATH: ${{ github.workspace }}/node_modules/@github/copilot/npm-loader.js
      COPILOT_AUTO_UPDATE: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval -- --suite smoke --require-pass
