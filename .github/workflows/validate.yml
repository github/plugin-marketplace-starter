name: Validate
# Lints every plugin's skills and every eval, and checks the catalog. Never calls a model.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
        env:
          VALLY_TELEMETRY_OPTOUT: '1'
      # Vally doesn't read marketplace.json or plugin.json, so parse them and match each local entry to its folder.
      - name: Check the catalog
        run: |
          node -e '
          const fs = require("fs");
          const read = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          for (const folder of fs.readdirSync("plugins")) read("plugins/" + folder + "/plugin.json");
          for (const plugin of read("marketplace.json").plugins.filter((entry) => typeof entry.source === "string")) {
            const manifest = read(plugin.source + "/plugin.json");
            if (manifest.name !== plugin.name || manifest.version !== plugin.version) throw new Error(plugin.name + ": marketplace.json and plugin.json disagree on name or version.");
          }
          '
