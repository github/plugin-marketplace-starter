name: Validate
# Lints skills and evals, checks plugin.json files and the catalog, and checks remote pins. Never calls a model.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
        env:
          VALLY_TELEMETRY_OPTOUT: '1'
      - name: Test CI checks and local-install recipes
        run: node --test .github/scripts/*.test.mjs
      - name: Validate plugin.json files against the Agent Plugins schema
        run: bash .github/scripts/validate-schema.sh
      # Vally doesn't read marketplace.json, so match each local entry to its plugin.json.
      - name: Check local catalog entries
        run: node .github/scripts/check-local-catalog.mjs
      # Remote entries pin a real commit with the matching name and optional version. A private repo needs a readable token.
      - name: Check remote pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-remote-pins.mjs
