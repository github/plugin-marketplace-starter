name: try-plugin-locally
description: Isolated Copilot CLI installation of a local plugin from a synthetic marketplace.
type: capability
defaults:
  executor: copilot-sdk
  model: claude-haiku-5.5
  timeout: 5m
  runs: 1
# All of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/plugin-authoring/skills/add-plugin
    - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
    - ../../../../plugins/plugin-authoring/skills/submit-plugin
grading_environment:
  files:
    - src: grader.mjs
      dest: .grading/grader.mjs
    - src: ../../../_shared/graders/common.mjs
      dest: .grading/common.mjs
stimuli:
  - name: try-plugin-locally-installs-and-cleans-cli-copy
    prompt: >-
      Let me try sample-notes before I open a PR. Do an install-only check with the
      Copilot CLI on PATH, not a model session. Use an isolated COPILOT_HOME at the
      absolute path of .fixture-copilot-home in this workspace, run the CLI from
      outside the checkout, and turn auto-update off. Check discovery, uninstall
      the test copy, and remove that test home afterward. Don't touch my real home.
    agent_environment:
      files:
        - src: ../../../_shared/fixtures/sample-marketplace
          dest: .
    tags:
      assets: skill:plugin-authoring/try-plugin-locally
      control: positive
      suite: smoke
      boundary: cli-installation-not-model-behavior
    graders:
      - type: completed
      - type: program
        config:
          program: node
          args: [.grading/grader.mjs]
  - name: try-plugin-locally-ignores-pricing-question
    prompt: Is a marketplace plugin the same thing as a paid Copilot subscription? Answer briefly without creating or changing files.
    tags:
      assets: skill:plugin-authoring/try-plugin-locally
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [add-plugin, try-plugin-locally, submit-plugin]
      - type: output-matches
        config:
          pattern: '[Nn]o\b|[Nn]ot the same'
      - type: diff-empty
scoring:
  threshold: 1
