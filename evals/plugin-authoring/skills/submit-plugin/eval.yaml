name: submit-plugin
description: Contribution preparation for an existing plugin in a synthetic marketplace.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 5m
  runs: 1
# All of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/plugin-authoring/skills/add-plugin
    - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
    - ../../../../plugins/plugin-authoring/skills/submit-plugin
stimuli:
  - name: submit-plugin-prepares-patch-and-pr-body
    prompt: >-
      Get sample-notes ready for a pull request. The only change since released.json
      is a wording fix clarifying that an empty input needs notes. It is an
      existing 1.0.0 plugin and needs a patch release. Use released.json as the
      comparison base instead of Git history. Synchronize its version and changelog,
      and draft the pull request description in chat. No code runs automatically,
      and no dependencies or network access were added. Don't create an issue,
      commit, push, or open a PR.
    agent_environment:
      files:
        - src: ../../../_shared/support/marketplace
          dest: .
        - src: fixture
          dest: .
    tags:
      assets: skill:plugin-authoring/submit-plugin
      control: positive
      suite: smoke
      boundary: synthetic-marketplace-files
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [submit-plugin]
      - type: file-matches
        name: plugin-json-is-at-1-0-1
        config:
          path: plugins/sample-notes/plugin.json
          pattern: '"version"\s*:\s*"1\.0\.1"'
      - type: file-matches
        name: the-catalog-is-at-1-0-1
        config:
          path: marketplace.json
          pattern: '"version"\s*:\s*"1\.0\.1"'
      - type: file-matches
        name: the-changelog-has-a-1-0-1-heading
        config:
          path: plugins/sample-notes/CHANGELOG.md
          pattern: '(?m)^## 1\.0\.1\s*$'
      - type: output-matches
        name: the-pr-body-has-its-sections-in-order
        config:
          pattern: '## What changed[\s\S]*## Version and changelog[\s\S]*## Checks[\s\S]*## Risk'
      - type: output-matches
        name: what-changed-describes-the-empty-input-fix
        config:
          pattern: '(?i)## What changed(?:(?!\n## )[\s\S])*empty'
      - type: output-matches
        name: version-and-changelog-states-1-0-1
        config:
          pattern: '## Version and changelog(?:(?!\n## )[\s\S])*1\.0\.1'
      - type: output-matches
        name: risk-says-it-runs-no-code
        config:
          pattern: "(?i)## Risk(?:(?!\\n## )[\\s\\S])*(?:no code|runs nothing|doesn't run|does not run|none)"
      - type: tool-calls
        name: no-pr-created-and-nothing-pushed
        config:
          disallowed:
            - name: '.'
              pattern: 'gh\s+pr\s+create|git\s+push'
      - type: run-command
        name: marketplace-json-is-still-valid-json
        config:
          command: node
          args: ["-p", "require('./marketplace.json').name"]
          stdout_contains: fixture-plugins
  - name: submit-plugin-ignores-pricing-question
    prompt: Is a marketplace plugin the same thing as a paid Copilot subscription? Answer briefly without creating or changing files.
    tags:
      assets: skill:plugin-authoring/submit-plugin
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [add-plugin, try-plugin-locally, submit-plugin]
      - type: output-matches
        config:
          pattern: '[Nn]o\b|[Nn]ot the same'
      - type: diff-empty
scoring:
  threshold: 1
