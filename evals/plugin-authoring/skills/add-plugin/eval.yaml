name: add-plugin
description: Creating a plugin shell by hand in a synthetic marketplace.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 5m
  runs: 1
# All of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/plugin-authoring/skills/add-plugin
    - ../../../../plugins/plugin-authoring/skills/try-plugin-locally
    - ../../../../plugins/plugin-authoring/skills/submit-plugin
stimuli:
  - name: add-plugin-scaffolds-plugin-shell
    prompt: >-
      Add a plugin named yaml-after-edit to this marketplace. It will format YAML
      after edits, but I'll write its parts myself later, so create only the
      plugin shell and register it. I have approved the contribution scope;
      don't create an issue or PR.
    agent_environment:
      files:
        - src: ../../../_shared/support/marketplace
          dest: .
    tags:
      assets: skill:plugin-authoring/add-plugin
      control: positive
      suite: smoke
      boundary: synthetic-marketplace-files
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [add-plugin]
      - type: file-matches
        name: plugin-json-is-named-yaml-after-edit
        config:
          path: plugins/yaml-after-edit/plugin.json
          pattern: '"name"\s*:\s*"yaml-after-edit"'
      - type: file-matches
        name: plugin-json-starts-at-version-0-1-0
        config:
          path: plugins/yaml-after-edit/plugin.json
          pattern: '"version"\s*:\s*"0\.1\.0"'
      - type: file-matches
        name: plugin-json-has-a-description
        config:
          path: plugins/yaml-after-edit/plugin.json
          pattern: '"description"\s*:\s*"[^"\s][^"]*"'
      - type: file-exists
        name: the-plugin-has-a-readme
        config:
          path: plugins/yaml-after-edit/README.md
      - type: file-matches
        name: the-changelog-has-a-0-1-0-heading
        config:
          path: plugins/yaml-after-edit/CHANGELOG.md
          pattern: '(?m)^## 0\.1\.0\s*$'
      - type: file-not-exists
        name: no-parts-in-subfolders-such-as-skills
        config:
          path: 'plugins/yaml-after-edit/*/**'
      - type: file-not-exists
        name: no-files-besides-the-three-shell-files
        config:
          path: 'plugins/yaml-after-edit/!(plugin.json|README.md|CHANGELOG.md)'
      - type: file-matches
        name: the-catalog-points-at-the-new-folder
        config:
          path: marketplace.json
          pattern: '"source"\s*:\s*"\./plugins/yaml-after-edit"'
      - type: file-matches
        name: the-catalog-lists-version-0-1-0
        config:
          path: marketplace.json
          pattern: '"version"\s*:\s*"0\.1\.0"'
      - type: file-contains
        name: the-readme-lists-the-plugin
        config:
          path: README.md
          value: plugins/yaml-after-edit/
      - type: file-contains
        name: the-existing-plugin-is-kept
        config:
          path: marketplace.json
          value: ./plugins/sample-notes
      - type: run-command
        name: marketplace-json-is-still-valid-json
        config:
          command: node
          args: ["-p", "require('./marketplace.json').name"]
          stdout_contains: fixture-plugins
  - name: add-plugin-ignores-pricing-question
    prompt: Is a marketplace plugin the same thing as a paid Copilot subscription? Answer briefly without creating or changing files.
    tags:
      assets: skill:plugin-authoring/add-plugin
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [add-plugin, try-plugin-locally, submit-plugin]
      - type: output-matches
        config:
          pattern: '[Nn]o\b|[Nn]ot the same'
      - type: diff-empty
scoring:
  threshold: 1
