name: release-plugins
description: Release readiness and retirement using real template checks in synthetic workspaces.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 5m
  runs: 1
# Both of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
    - ../../../../plugins/marketplace-maintainer/skills/release-plugins
grading_environment:
  files:
    - src: ../../graders.mjs
      dest: .grading/marketplace-maintainer.mjs
    - src: ../../../graders/common.mjs
      dest: .grading/common.mjs
stimuli:
  - name: release-plugins-keeps-already-bumped-version
    prompt: >-
      Get this catalog ready to release against released.json. sample-notes has
      already been bumped and its changelog describes the wording fix. Check the
      versions and changelog, run the fixture's static verify command, and draft
      short release notes in chat. Don't increment its version again or publish.
      No model-backed eval or manual host test was run.
    agent_environment:
      commands:
        - node "${MAINTENANCE_WORKSPACE}" release
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: positive
      suite: smoke
      boundary: synthetic-template-static-workflow
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [release-plugins]
      - type: program
        config:
          program: node
          args: [.grading/marketplace-maintainer.mjs, release]
  - name: release-plugins-retires-approved-plugin
    prompt: >-
      Retire sample-notes from this synthetic marketplace. I approve removing this
      exact local plugin and its owned files because it is no longer maintained.
      Inspect the removal dry run, use the repository removal command, verify the
      remaining catalog, and draft a retirement note. Preserve shared tooling.
      Don't commit, push, publish, or uninstall anyone's existing real copy.
    agent_environment:
      commands:
        - node "${MAINTENANCE_WORKSPACE}" release
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: positive
      boundary: synthetic-template-static-workflow
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [release-plugins]
      - type: program
        config:
          program: node
          args: [.grading/marketplace-maintainer.mjs, retire]
  - name: release-plugins-ignores-local-copy-edit
    prompt: >-
      Rewrite this local plugin description in plain English, in chat only:
      "Facilitates the summarization of notes." Don't change files or prepare a release.
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [update-remote-pins, release-plugins]
      - type: output-matches
        config:
          pattern: '[Ss]ummariz(?:e|es|ing) notes'
      - type: diff-empty
scoring:
  threshold: 1
