name: release-plugins
description: Release readiness and retirement in a synthetic marketplace.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 5m
  runs: 1
# Both of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
    - ../../../../plugins/marketplace-maintainer/skills/release-plugins
stimuli:
  - name: release-plugins-keeps-already-bumped-version
    prompt: >-
      Get this catalog ready to release against released.json. sample-notes has
      already been bumped and its changelog describes the wording fix. Check the
      versions and changelog, and draft short release notes in chat. Don't
      increment its version again or publish. No model-backed eval or manual host
      test was run.
    agent_environment:
      files:
        - src: ../../../_shared/fixtures/sample-marketplace
          dest: .
        - src: fixtures
          dest: .
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: positive
      suite: smoke
      boundary: synthetic-marketplace-files
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [release-plugins]
      - type: file-matches
        name: plugin-json-stays-at-1-0-1
        config:
          path: plugins/sample-notes/plugin.json
          pattern: '"version"\s*:\s*"1\.0\.1"'
      - type: file-matches
        name: the-catalog-stays-at-1-0-1
        config:
          path: marketplace.json
          pattern: '"version"\s*:\s*"1\.0\.1"'
      - type: file-matches
        name: the-changelog-keeps-its-1-0-1-heading
        config:
          path: plugins/sample-notes/CHANGELOG.md
          pattern: '(?m)^## 1\.0\.1\s*$'
      - type: output-matches
        name: the-notes-name-the-plugin
        config:
          pattern: sample-notes
      - type: output-matches
        name: the-notes-name-the-version
        config:
          pattern: '1\.0\.1'
      - type: output-matches
        name: the-notes-describe-the-empty-input-change
        config:
          pattern: '(?i)empty.input'
      - type: tool-calls
        name: nothing-published
        config:
          disallowed:
            - name: '.'
              pattern: 'gh\s+release\s+create|git\s+(?:push|tag)\b'
      - type: run-command
        name: marketplace-json-is-still-valid-json
        config:
          command: node
          args: ["-p", "require('./marketplace.json').name"]
          stdout_contains: fixture-plugins
  - name: release-plugins-retires-approved-plugin
    prompt: >-
      Retire sample-notes from this synthetic marketplace. I approve removing this
      exact local plugin, its folder, and its evals because it is no longer
      maintained. Update the catalog and the README, and
      draft a retirement note. Don't commit, push, publish, or uninstall anyone's
      existing real copy.
    agent_environment:
      files:
        - src: ../../../_shared/fixtures/sample-marketplace
          dest: .
        - src: fixtures
          dest: .
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: positive
      boundary: synthetic-marketplace-files
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [release-plugins]
      - type: file-not-exists
        name: the-plugin-folder-is-gone
        config:
          path: 'plugins/sample-notes/**'
      - type: file-not-exists
        name: the-plugins-evals-are-gone
        config:
          path: 'evals/sample-notes/**'
      - type: file-not-contains
        name: the-catalog-entry-is-gone
        config:
          path: marketplace.json
          value: sample-notes
      - type: file-not-matches
        name: the-readme-row-and-install-command-are-gone
        config:
          path: README.md
          pattern: 'plugins/sample-notes|install sample-notes@'
      - type: file-exists
        name: the-rest-of-the-marketplace-is-kept
        config:
          path: AGENTS.md
      - type: output-matches
        name: the-note-names-the-plugin
        config:
          pattern: sample-notes
      - type: output-matches
        name: the-note-is-a-retirement-note
        config:
          pattern: '(?i)retir'
      - type: run-command
        name: marketplace-json-is-valid-after-retiring
        config:
          command: node
          args: ["-p", "require('./marketplace.json').name"]
          stdout_contains: fixture-plugins
  - name: release-plugins-ignores-local-copy-edit
    prompt: >-
      Rewrite this local plugin description in plain English, in chat only:
      "Facilitates the summarization of notes." Don't change files or prepare a release.
    tags:
      assets: skill:marketplace-maintainer/release-plugins
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [update-remote-pins, release-plugins]
      - type: output-matches
        config:
          pattern: '[Ss]ummariz(?:e|es|ing) notes'
      - type: diff-empty
scoring:
  threshold: 1
