name: update-remote-pins
description: Deliberate remote pins using synthetic offline upstream evidence.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 5m
  runs: 1
# Both of the plugin's skills load, as they do when it's installed, so these
# cases also check that Copilot picks the right one.
agent_environment:
  skills:
    - ../../../../plugins/marketplace-maintainer/skills/update-remote-pins
    - ../../../../plugins/marketplace-maintainer/skills/release-plugins
stimuli:
  - name: update-remote-pins-uses-reviewed-release
    prompt: >-
      Pin outside-notes at its latest release using the reviewed offline
      upstream-snapshot.json instead of GitHub. Its current catalog pin is the
      previous release. Review and summarize the supplied upstream changes, update
      the selected entry. Don't access the network, install
      upstream code, commit, or publish. State the offline verification limit.
    agent_environment:
      files:
        - src: ../../../_shared/support/marketplace
          dest: .
        - src: fixture
          dest: .
    tags:
      assets: skill:marketplace-maintainer/update-remote-pins
      control: positive
      suite: smoke
      boundary: recorded-upstream-not-live-github
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [update-remote-pins]
      - type: file-matches
        name: the-pin-moved-to-the-reviewed-sha
        config:
          path: marketplace.json
          pattern: '"sha"\s*:\s*"b{40}"'
      - type: file-matches
        name: the-pin-names-the-v1-1-0-ref
        config:
          path: marketplace.json
          pattern: '"ref"\s*:\s*"v1\.1\.0"'
      - type: file-matches
        name: the-entry-is-at-version-1-1-0
        config:
          path: marketplace.json
          pattern: '"version"\s*:\s*"1\.1\.0"'
      - type: file-matches
        name: the-entry-still-points-at-the-same-repo
        config:
          path: marketplace.json
          pattern: '"repo"\s*:\s*"fixture-org/outside-notes"'
      - type: file-matches
        name: the-local-plugin-entry-is-kept
        config:
          path: marketplace.json
          pattern: '"source"\s*:\s*"\./plugins/sample-notes"'
      - type: file-matches
        name: the-local-plugin-stays-at-1-0-0
        config:
          path: marketplace.json
          pattern: '"version"\s*:\s*"1\.0\.0"'
      - type: output-matches
        name: summarizes-the-upstream-change
        config:
          pattern: '(?i)empty note lists'
      - type: output-matches
        name: states-the-offline-limit
        config:
          pattern: '(?i)offline|recorded'
      - type: run-command
        name: marketplace-json-is-still-valid-json
        config:
          command: node
          args: ["-p", "require('./marketplace.json').name"]
          stdout_contains: fixture-plugins
  - name: update-remote-pins-ignores-local-copy-edit
    prompt: >-
      Rewrite this local plugin description in plain English, in chat only:
      "Facilitates the summarization of notes." Don't change files or prepare a release.
    tags:
      assets: skill:marketplace-maintainer/update-remote-pins
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [update-remote-pins, release-plugins]
      - type: output-matches
        config:
          pattern: '[Ss]ummariz(?:e|es|ing) notes'
      - type: diff-empty
scoring:
  threshold: 1
