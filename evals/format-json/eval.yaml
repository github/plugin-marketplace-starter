name: format-json-integration
description: The actual packaged post-tool hook formats a compact model edit and diagnoses invalid JSON.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 2m
  runs: 1
agent_environment:
  env:
    # Mounts the real plugin with --plugin-dir through scripts/eval-runtime.js.
    STARTER_PLUGIN_DIRS: plugins/format-json
  files:
    - src: fixtures/input.json
      dest: input.json
grading_environment:
  files:
    - src: ../graders
      dest: .grading
stimuli:
  - name: format-json-runs-after-compact-edit
    prompt: >-
      Use apply_patch to replace input.json with exactly the compact single line
      {"enabled":true,"count":2}. Don't pretty-print it yourself or run shell
      commands. Let the installed format-json post-tool hook handle formatting.
      Re-read the file and report the final values. Do not change any other files.
    tags:
      assets: hook:format-json/postToolUse
      suite: smoke
      control: positive
    graders:
      - type: completed
      - type: tool-calls
        config:
          required: ['^apply_patch$']
          disallowed: ['^(bash|powershell|shell|task)$']
      - type: program
        config:
          program: node
          args: [.grading/format-json.mjs, format]
    artifacts:
      include: [input.json]
  - name: format-json-leaves-invalid-fixture-unchanged
    prompt: >-
      input.json is a deliberate parser-regression fixture. Use apply_patch to
      replace its contents with exactly the single malformed line {"enabled":}.
      Do not repair or format it and do not run shell commands. Report the
      format-json hook's diagnostic, and leave all other files unchanged.
    tags:
      assets: hook:format-json/postToolUse
      control: negative
    graders:
      - type: completed
      - type: tool-calls
        config:
          required: ['^apply_patch$']
          disallowed: ['^(bash|powershell|shell|task)$']
      - type: program
        config:
          program: node
          args: [.grading/format-json.mjs, invalid]
    artifacts:
      include: [input.json]
scoring:
  threshold: 1
